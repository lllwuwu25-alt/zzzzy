[package]
name = "mistake-notebook"
version = "0.1.9"
description = "错题本：本地优先的错题整理与复习系统"
authors = ["Mistake Notebook"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mistake_notebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
base64 = "0.22"
infer = "0.19"
