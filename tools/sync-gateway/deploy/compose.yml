name: mistake-notebook-staging
services:
  gateway:
    build:
      context: ../../..
      dockerfile: tools/sync-gateway/Dockerfile
      target: gateway
    env_file: ../.env
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - gateway_data:/data
      - gateway_backups:/backups
    expose: ["8787"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ../../..
      dockerfile: tools/sync-gateway/Dockerfile
      target: web
      args:
        VITE_SYNC_GATEWAY_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in the operator env file}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  gateway_data:
  gateway_backups:
  caddy_data:
  caddy_config:
